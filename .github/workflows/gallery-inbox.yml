name: Add gallery photos from inbox

on:
  push:
    branches: [master]
    paths:
      - 'photo-inbox/**'

permissions:
  contents: write

concurrency:
  group: gallery-inbox
  cancel-in-progress: false

jobs:
  add-photos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Any photos in the inbox?
        id: check
        run: |
          shopt -s nullglob nocaseglob
          files=(photo-inbox/*.jpg photo-inbox/*.jpeg photo-inbox/*.png photo-inbox/*.heic photo-inbox/*.webp)
          echo "has=$([ ${#files[@]} -gt 0 ] && echo 1 || echo 0)" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        if: steps.check.outputs.has == '1'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Pillow (+ HEIC support)
        if: steps.check.outputs.has == '1'
        run: pip install pillow pillow-heif

      - name: Optimise and add to the gallery
        # 'auto' = use the year at the FRONT of the filename (e.g. "2015 harbour.jpg"
        # -> 2015); anything without a leading year defaults to the current year.
        if: steps.check.outputs.has == '1'
        run: python tools/add_gallery_photos.py auto photo-inbox/ --clean

      - name: Commit and push
        if: steps.check.outputs.has == '1'
        run: |
          git config user.name "gallery-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing changed."
          else
            git commit -m "gallery: add $(date +%Y) photos from inbox [skip ci]"
            git push
          fi
